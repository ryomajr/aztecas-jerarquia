<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personajes - Mapa RP</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: #111;
            color: #ccc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background: #1a1a1a;
            border-bottom: 2px solid #ff6600;
        }

        .navbar-brand {
            color: #ff6600 !important;
            font-weight: bold;
            font-size: 1.5rem;
        }

        .nav-link {
            color: #ccc !important;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #ff6600 !important;
        }

        .container-main {
            min-height: 100vh;
            padding: 40px 20px;
        }

        .section-title {
            color: #ff6600;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 102, 0, 0.5);
        }

        .character-card {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .character-card:hover {
            border-color: #ff6600;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.4);
            transform: translateY(-5px);
        }

        .character-card img {
            width: 100%;
            height: auto;
            object-fit: cover;
            background: #0d0d0d;
        }

        .character-card-body {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .character-name {
            color: #ff6600;
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .character-description {
            color: #999;
            font-size: 0.9rem;
            flex-grow: 1;
        }

        .btn-view-details {
            background: #ff6600;
            border: none;
            color: #000;
            font-weight: bold;
            margin-top: 15px;
            transition: all 0.3s;
            width: 100%;
        }

        .btn-view-details:hover {
            background: #ff8533;
            transform: scale(1.05);
        }

        /* Modal personalizado */
        .modal-content {
            background: #1a1a1a;
            border: 2px solid #ff6600;
            color: #ccc;
            height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            border-bottom: 2px solid #ff6600;
            background: #0d0d0d;
            flex-shrink: 0;
        }

        .modal-title {
            color: #ff6600;
            font-weight: bold;
        }

        .close, .btn-close {
            filter: brightness(0) invert(1);
        }

        .modal-body {
            padding: 10px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-body img {
            width: 100%;
            height: auto;
            object-fit: cover;
            border-radius: 8px;
        }

        .modal-body h2 {
            color: #ff6600;
        }

        .modal-body p, .modal-body li {
            color: #ccc;
        }

        .modal-body hr {
            border-color: #333;
        }

        .modal-info {
            background: #0d0d0d;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #ff6600;
        }

        /* Personalizar modal size */
        .modal-fullscreen-custom {
            width: 90vw;
            max-width: 90%;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #ff6600;
            font-size: 1.2rem;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #ff6600;
        }

        .spinner-border {
            color: #ff6600;
        }

        .character-img-wrapper {
            background: #0d0d0d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .character-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display:block;
        }
        .character-card {
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">🗺️ Mapa RP</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Mapa</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="personajes.html">Personajes</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="container-main">
        <h1 class="section-title">Personajes</h1>

        <!-- Loading -->
        <div id="loading" class="loading">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
        </div>

        <!-- Grid de Personajes -->
        <div id="characters-container" class="row g-4">
            <!-- Las tarjetas se cargan aquí con JavaScript -->
        </div>

        <!-- Mensaje sin resultados -->
        <div id="no-results" class="no-results" style="display: none;">
            No hay personajes disponibles.
        </div>
    </div>

    <!-- Modal de Detalles -->
    <div class="modal fade" id="characterModal" tabindex="-1">
        <div class="modal-dialog modal-fullscreen-custom">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalCharacterName"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalCharacterDetails">
                    <!-- El contenido del HTML se carga aquí -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const container = document.getElementById('characters-container');
        const loading = document.getElementById('loading');
        const noResults = document.getElementById('no-results');

        // Cargar personajes desde el JSON
        async function loadCharacters() {
            try {
                const response = await fetch('personajes.json');
                const characters = await response.json();

                loading.style.display = 'none';

                if (characters.length === 0) {
                    noResults.style.display = 'block';
                    return;
                }

                // Crear tarjetas para cada personaje
                characters.forEach(character => {
                    const card = document.createElement('div');
                    card.className = 'col-md-6 col-lg-2';
                    card.innerHTML = `
                        <div class="character-card" onclick="viewCharacterDetails(event)" data-character='${JSON.stringify(character)}'>
                            <div class="ratio ratio-1x1 character-img-wrapper">
                                <img src="${character.imgCaraUrl}" alt="${character.nombre}" class="character-img">
                            </div>
                            <div class="character-card-body">
                                <div class="character-name">${character.nombre}</div>
                                <div class="character-description">${character.rol || 'Personaje importante'}</div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                    
                    // Manejar errores de imagen sin reintentos constantes
                    const img = card.querySelector('.character-img');
                    img.addEventListener('error', function() {
                        if (!this.dataset.errorHandled) {
                            this.dataset.errorHandled = 'true';
                            this.style.background = '#333';
                            this.style.display = 'flex';
                            this.style.alignItems = 'center';
                            this.style.justifyContent = 'center';
                            this.alt = 'Imagen no disponible';
                        }
                    }, { once: true });
                });

            } catch (error) {
                console.error('Error cargando personajes:', error);
                loading.innerHTML = '<p style="color: #ff6600;">Error al cargar personajes.</p>';
            }
        }

        // Ver detalles del personaje
        async function viewCharacterDetails(event) {
            event.preventDefault();
            const card = event.target.closest('.character-card');
            const character = JSON.parse(card.dataset.character);

            // Actualizar modal
            document.getElementById('modalCharacterName').textContent = character.nombre;

            // Cargar descripción HTML
            try {
                const response = await fetch(character.descripcionUrl);
                const html = await response.text();
                document.getElementById('modalCharacterDetails').innerHTML = html;
                
                // Actualizar imágenes con los URLs del JSON
                const portraitImg = document.querySelector('.character-portrait-img');
                const fullbodyImg = document.querySelector('.character-fullbody-img');
                
                if (portraitImg && character.imgCaraUrl) {
                    portraitImg.src = character.imgCaraUrl;
                }
                if (fullbodyImg && character.imgUrl) {
                    fullbodyImg.src = character.imgUrl;
                }
                
            } catch (error) {
                document.getElementById('modalCharacterDetails').innerHTML = '<p>No hay información disponible.</p>';
            }

            // Mostrar modal
            const modal = new bootstrap.Modal(document.getElementById('characterModal'));
            modal.show();
        }

        // Cargar personajes al iniciar
        loadCharacters();
    </script>
</body>
</html>
